<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halaxy Clinic</title>
<style>
:root{--red:#d93645;--ink:#202633;--muted:#687386;--line:#e8ebf0;--bg:#f6f7fa}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none;cursor:pointer}button{cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-size:22px;font-weight:850;color:var(--red)}.brand span{color:var(--ink)}.btn{border:0;background:var(--red);color:white;padding:10px 16px;border-radius:8px;font-weight:700}.light{background:#fff;color:var(--red);border:1px solid #f0c9ce}.ghost{background:#f1f3f6;color:#344054}.hero{padding:70px 8vw;background:linear-gradient(120deg,#fff 55%,#fff0f1);display:grid;grid-template-columns:1.2fr .8fr;gap:35px;align-items:center}.hero h1{font-size:clamp(38px,5vw,58px);line-height:1.1;letter-spacing:-2px;margin:12px 0}.hero p{font-size:17px;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);font-weight:800}.panel,.card,.auth{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;margin-bottom:18px}.quick,.stats,.features{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick div{padding:17px;background:#fff6f6;border-radius:10px}.features{grid-template-columns:repeat(4,1fr);padding:38px 7vw}.feature{background:white;border:1px solid var(--line);padding:20px;border-radius:12px}.authwrap{min-height:75vh;display:grid;place-items:center;padding:30px}.auth{width:min(440px,100%);padding:30px}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce1e8;border-radius:8px}.field textarea{min-height:80px}.dash{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}aside{background:#202633;padding:22px 15px;color:white}aside .brand{display:block;padding:0 10px 18px}.side{display:block;padding:10px 12px;color:#e1e4ea;border-radius:8px;margin:3px 0}.side:hover,.side.active{background:#ffffff1b}main{padding:30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{margin:0;font-size:27px}.stats{grid-template-columns:repeat(4,1fr)}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.stat strong{display:block;font-size:25px;color:var(--red)}.muted,small{color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:#788294;background:#fafbfc}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eee;font-size:11px;font-weight:750}.Pending{background:#fff1d8;color:#8a5a09}.Approved,.Paid,.Completed{background:#e5f6ed;color:#13744f}.Cancelled,.Unpaid{background:#ffeded;color:#b52b38}.actions{display:flex;gap:6px;flex-wrap:wrap}.smallbtn{padding:6px 9px;font-size:12px}.msg{padding:10px;border-radius:8px;background:#e5f6ed;color:#13744f;margin:10px 0}.err{background:#ffeded;color:#b52b38}.notice{background:#fff6e5;padding:13px;border-radius:9px;color:#805b1a;font-size:13px}.footer{text-align:center;color:#8b94a2;padding:22px;background:#fff;border-top:1px solid var(--line)}@media(max-width:850px){.hero{grid-template-columns:1fr}.features{grid-template-columns:repeat(2,1fr)}.dash{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;padding:8px}aside .brand{display:none}.side{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}main{padding:20px}}@media(max-width:540px){.features{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let me=null,data=null,page='home',notice='';
async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Something went wrong');return j}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(){return notice?`<div class="msg ${notice.startsWith('Error:')?'err':''}">${esc(notice.replace(/^Error: /,''))}</div>`:''}
async function refresh(){if(me)data=await api('/api/data')}
function header(){return `<header class="top"><a class="brand" href="#" data-page="home">HALAXY<span> CLINIC</span></a><nav>${me?`<a href="#" data-page="dashboard">Dashboard</a> &nbsp; <a href="#" data-action="logout">Logout</a>`:`<a href="#" data-page="login">Login</a> &nbsp; <button class="btn" data-page="register">Create account</button>`}</nav></header>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Care that puts you first</div><h1>Your health is our <span style="color:var(--red)">priority.</span></h1><p>Welcome to ${esc(data?.settings?.name||'Halaxy Clinic')}. Book appointments, manage visits and keep your healthcare journey organised in one simple place.</p><button class="btn" data-page="register">Get started →</button> <button class="btn light" data-page="login">Login</button></div><div class="panel"><div class="eyebrow">Clinic portal</div><h2>Everything you need, in one place.</h2><div class="quick"><div>📅<b> Easy booking</b><br><small>Request an appointment</small></div><div>🩺<b> Care team</b><br><small>Connect with your doctor</small></div><div>📋<b> Visit history</b><br><small>Track appointment status</small></div><div>💳<b> Payments</b><br><small>View payment records</small></div></div></div></section><section class="features"><div class="feature">📅<h3>Book appointments</h3><small>Choose a date and time.</small></div><div class="feature">👩‍⚕️<h3>Doctor dashboard</h3><small>Manage patient visits.</small></div><div class="feature">💳<h3>Payment records</h3><small>Keep payments organised.</small></div><div class="feature">🔒<h3>Shared database</h3><small>One SQLite database for this app.</small></div></section>`}
function auth(){let reg=page==='register';return `<div class="authwrap"><form class="auth" id="authForm"><div class="eyebrow">${reg?'Join our clinic':'Welcome back'}</div><h1>${reg?'Create account':'Login'}</h1>${msg()}${reg?`<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div>`:''}<div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password ${reg?'(minimum 6 characters)':''}</label><input name="password" type="password" minlength="6" required></div>${reg?`<div class="field"><label>Account type</label><select name="role"><option value="patient">Patient</option><option value="doctor">Doctor</option></select></div>`:''}<button class="btn" style="width:100%">${reg?'Create account':'Login'}</button><p><small>${reg?'Already registered?':'New to the clinic?'} <a href="#" data-page="${reg?'login':'register'}" style="color:var(--red)"> ${reg?'Login':'Create account'}</a></small></p>${!reg?`<small>Demo: doctor@halaxy.com / password<br>Patient: patient@halaxy.com / password</small>`:''}</form></div>`}
function sideLink(p,t){return `<a class="side ${page===p?'active':''}" href="#" data-page="${p}">${t}</a>`}
function shell(content){let links=me.role==='doctor'?sideLink('dashboard','▦ Dashboard')+sideLink('appointments','▣ Appointments')+sideLink('patients','♙ Patients')+sideLink('payments','＄ Payments')+sideLink('settings','⚙ Clinic details'):sideLink('dashboard','▦ Dashboard')+sideLink('book','＋ Book appointment')+sideLink('appointments','▣ My appointments')+sideLink('payments','＄ Payment history');return `<div class="dash"><aside><a class="brand">HALAXY</a><div style="padding:10px 12px;color:#ccd2dc"><b>${esc(me.name)}</b><br><small>${esc(me.role)}</small></div>${links}<a class="side" href="#" data-action="logout">↪ Logout</a></aside><main>${content}</main></div>`}
function table(rows,heads){return rows.length?`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div style="text-align:center;padding:25px;color:var(--muted)">Nothing to show yet.</div>`}
const pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`,stat=(n,t)=>`<div class="stat"><strong>${n}</strong><small>${t}</small></div>`;
function dashboard(){let a=data.appointments,pending=a.filter(x=>x.status==='Pending').length,approved=a.filter(x=>x.status==='Approved').length,done=a.filter(x=>x.status==='Completed').length;let paid=data.payments.filter(x=>x.status==='Paid').reduce((s,x)=>s+Number(x.amount),0);let stats=me.role==='doctor'?[stat(a.length,'Total appointments'),stat(pending,'Pending requests'),stat(approved,'Approved'),stat(done,'Completed')]:[stat(a.length,'Appointments'),stat(pending,'Pending'),stat(done,'Completed'),stat('R'+paid.toFixed(2),'Total paid')];let rows=a.slice(0,7).map(x=>`<tr><td>${esc(me.role==='doctor'?x.patient_name:x.doctor_name)}</td><td>${esc(x.date)}</td><td>${esc(x.time)}</td><td>${pill(x.status)}</td></tr>`);return `<div class="head"><div><div class="eyebrow">Overview</div><h1>${me.role==='doctor'?'Doctor':'Patient'} dashboard</h1><small>Hello ${esc(me.name)}, here's your clinic overview.</small></div>${me.role==='patient'?'<button class="btn" data-page="book">+ Book appointment</button>':''}</div>${msg()}<div class="stats">${stats.join('')}</div><div class="card"><h2>Recent appointments</h2>${table(rows,[me.role==='doctor'?'Patient':'Doctor','Date','Time','Status'])}</div>`}
function appointments(){let doctor=me.role==='doctor';let rows=data.appointments.map(a=>`<tr><td>${esc(doctor?a.patient_name:a.doctor_name)}</td><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(a.reason)}</td><td>${pill(a.status)}</td><td><div class="actions">${doctor?(a.status==='Pending'?`<button class="btn smallbtn" data-status="${a.id}|Approved">Approve</button>`:'')+(a.status==='Approved'?`<button class="btn ghost smallbtn" data-status="${a.id}|Completed">Complete</button>`:'')+(a.status!=='Cancelled'&&a.status!=='Completed'?`<button class="btn ghost smallbtn" data-status="${a.id}|Cancelled">Cancel</button>`:''):(a.status==='Pending'?`<button class="btn ghost smallbtn" data-status="${a.id}|Cancelled">Cancel</button>`:'')}</div></td></tr>`);return `<div class="head"><h1>${doctor?'Appointments':'My appointments'}</h1>${doctor?'':'<button class="btn" data-page="book">+ Book appointment</button>'}</div>${msg()}<div class="card">${table(rows,[doctor?'Patient':'Doctor','Date','Time','Reason','Status','Actions'])}</div>`}
function book(){return `<div class="head"><h1>Book an appointment</h1></div>${msg()}<div class="card" style="max-width:650px"><form id="bookForm"><div class="field"><label>Select doctor</label><select name="doctor_id" required>${data.doctors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="field"><label>Date</label><input type="date" name="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Time</label><input type="time" name="time" required></div></div><div class="field"><label>Reason for visit</label><textarea name="reason"></textarea></div><button class="btn">Submit request</button></form></div>`}
function patients(){return `<div class="head"><h1>Patients</h1></div><div class="card">${table(data.patients.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.phone||'—')}</td></tr>`),['Patient','Email','Phone'])}</div>`}
function payments(){return `<div class="head"><h1>Payment history</h1></div><div class="card">${table(data.payments.map(p=>`<tr><td>${esc(p.patient_name)}</td><td>R${Number(p.amount).toFixed(2)}</td><td>${esc(p.method)}</td><td>${esc(p.date)}</td><td>${pill(p.status)}</td></tr>`),['Patient','Amount','Method','Date','Status'])}</div>`}
function settings(){let s=data.settings;return `<div class="head"><h1>Clinic details</h1></div>${msg()}<div class="card" style="max-width:650px"><form id="settingsForm"><div class="field"><label>Clinic name</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(s.email)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Address</label><textarea name="address">${esc(s.address)}</textarea></div><button class="btn">Save details</button></form></div><div class="notice">The SQLite database is stored locally in the clinic_data folder. Use the backup button to download a JSON copy of your records.</div><p><button class="btn ghost" data-action="export">Export data backup</button></p>`}
function render(){let c=page==='home'?home():['login','register'].includes(page)?auth():!me?auth():page==='dashboard'?dashboard():page==='appointments'?appointments():page==='book'?book():page==='patients'?patients():page==='payments'?payments():page==='settings'?settings():dashboard();$('#app').innerHTML=header()+(me&&!['home','login','register'].includes(page)?shell(c):c)+`<footer class="footer">© ${new Date().getFullYear()} ${esc(data?.settings?.name||'Halaxy Clinic')} · Local SQLite edition</footer>`}
async function go(p){page=p;notice='';if(me)await refresh();render()}
document.addEventListener('click',async e=>{let p=e.target.closest('[data-page]');if(p){e.preventDefault();await go(p.dataset.page);return}let a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='logout'){await api('/api/logout','DELETE');me=null;data=null;await go('home')}if(a.dataset.action==='export'){let r=await fetch('/api/export');let blob=await r.blob(),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='halaxy-backup.json';el.click();URL.revokeObjectURL(url)}return}let s=e.target.closest('[data-status]');if(s){let [id,status]=s.dataset.status.split('|');try{await api('/api/appointments/'+id,'PATCH',{status});await refresh();render()}catch(err){notice='Error: '+err.message;render()}}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),obj=Object.fromEntries(f.entries());try{if(e.target.id==='authForm'){let reg=page==='register';let r=await api('/api/'+(reg?'register':'login'),'POST',obj);me=r.user;await go('dashboard')}else if(e.target.id==='bookForm'){obj.doctor_id=Number(obj.doctor_id);await api('/api/appointments','POST',obj);notice='Appointment request submitted.';await go('appointments')}else if(e.target.id==='settingsForm'){await api('/api/settings','PUT',obj);notice='Clinic details saved.';await go('settings')}}catch(err){notice='Error: '+err.message;render()}});
(async()=>{try{let r=await api('/api/me');me=r.user;if(me)await refresh()}catch(e){}render()})();
</script></body></html>
